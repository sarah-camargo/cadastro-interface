<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PowerFit</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="pagina">

        <div class="apresentacao">
            <h1>BeatyCare</h1>

            <h2>Comece-se cuidando.</h2>

            <p>
                Cadastre-se e sinta a beleza e bem-estar em um só luga.
            </p>

            <div class="beneficios">
                <h3>Seus benefícios</h3>
                <p>✓ Acesso exclusivo</p>
                <p>✓ Tratamentos personalizados</p>
                <p>✓ Acompanhamento profissional</p>
            </div>
        </div>

        <div class="area-cadastro">
            <h2>Crie sua conta</h2>
            <p>Preencha seus dados para começar.</p>

            <form action="">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" placeholder="Repita sua senha" required>

                <button type="submit">Criar minha conta</button>

            </form>

            <p class="login">
                Já possui uma conta?
                <a href="#">Entre aqui</a>
            </p>
        </div>

    </div>

</body>

</html>
